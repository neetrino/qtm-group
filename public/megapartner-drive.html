<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaPartner belt drive</title>
  <style>
    :root {
      --red: #E81E23;
      --black: #181818;
      --paper: #f7f7f5;
      --belt: #343432;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
    }

    body {
      display: grid;
      place-items: center;
    }

    svg {
      display: block;
      width: min(100%, 920px);
      height: auto;
      max-height: 100%;
    }

    .belt-base {
      fill: none;
      stroke: var(--belt);
      stroke-width: 7;
      stroke-linecap: round;
    }

    .belt-motion {
      fill: none;
      stroke: var(--red);
      stroke-width: 2;
      stroke-linecap: butt;
      stroke-dasharray: 12 12;
      animation: belt-travel 1.1s linear infinite;
    }

    .gear-ring {
      transform-box: view-box;
      transform-origin: var(--gear-x) var(--gear-y);
      animation: gear-turn var(--gear-duration) linear infinite;
      will-change: transform;
    }

    .gear-tooth {
      fill: var(--red);
      stroke: none;
    }

    .gear-outer {
      fill: var(--paper);
      stroke: var(--black);
      stroke-width: 4;
    }

    .gear-detail {
      fill: none;
      stroke: rgba(24, 24, 24, .32);
      stroke-width: 1.5;
    }

    .gear-inner {
      fill: var(--paper);
      stroke: var(--red);
      stroke-width: 2;
    }

    .static-image {
      pointer-events: none;
      transform: none !important;
      animation: none !important;
    }

    .mega-image {
      mix-blend-mode: multiply;
    }

    @keyframes gear-turn {
      to { transform: rotate(360deg); }
    }

    @keyframes belt-travel {
      to { stroke-dashoffset: -48; }
    }

    @media (max-width: 600px) {
      .belt-base { stroke-width: 6; }
      .belt-motion { stroke-width: 2; stroke-dasharray: 10 10; }
      .gear-outer { stroke-width: 3; }
      .gear-detail { stroke-width: 1.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gear-ring,
      .belt-motion {
        animation-play-state: paused;
      }
    }
  </style>
</head>
<body>
  <svg id="drive" viewBox="0 0 820 520" role="img" aria-labelledby="drive-title drive-desc">
    <title id="drive-title">MegaPartner and QTM belt drive</title>
    <desc id="drive-desc">A large MegaPartner gear at the top left and a smaller QTM gear at the bottom right, connected by two moving tangent belt runs. Both center images remain upright while their gear rings rotate clockwise.</desc>

    <defs>
      <clipPath id="mega-image-clip">
        <circle cx="245" cy="180" r="116"/>
      </clipPath>
      <clipPath id="q-image-clip">
        <circle cx="630" cy="390" r="55"/>
      </clipPath>
    </defs>

    <g id="belt" aria-hidden="true"></g>
    <g id="big-gear" aria-hidden="true"></g>
    <g id="small-gear" aria-hidden="true"></g>

    <image
      class="static-image mega-image"
      href="/assets/megapartner-badge.webp"
      x="129"
      y="64"
      width="232"
      height="232"
      preserveAspectRatio="xMidYMid meet"
      clip-path="url(#mega-image-clip)"
    />
    <image
      class="static-image"
      href="/assets/qtm-q-logo.png"
      x="575"
      y="335"
      width="110"
      height="110"
      preserveAspectRatio="xMidYMid meet"
      clip-path="url(#q-image-clip)"
    />
  </svg>

  <script>
    (() => {
      const NS = "http://www.w3.org/2000/svg";
      const BIG = { x: 245, y: 180, radius: 150, teeth: 12, duration: 12 };
      const SMALL = { x: 630, y: 390, radius: 80, teeth: 8, duration: 6.4 };

      function svgElement(name, attributes = {}) {
        const element = document.createElementNS(NS, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }
        return element;
      }

      function point(cx, cy, radius, angle) {
        return [
          cx + Math.cos(angle) * radius,
          cy + Math.sin(angle) * radius
        ];
      }

      function pointsAttribute(points) {
        return points.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(" ");
      }

      function drawGear(targetId, gear) {
        const target = document.getElementById(targetId);
        const ring = svgElement("g", {
          class: "gear-ring",
          style: `--gear-x:${gear.x}px;--gear-y:${gear.y}px;--gear-duration:${gear.duration}s`
        });

        const step = (Math.PI * 2) / gear.teeth;
        const innerRadius = gear.radius - 4;
        const rootRadius = gear.radius;
        const outerRadius = gear.radius + Math.max(9, gear.radius * .075);

        for (let index = 0; index < gear.teeth; index += 1) {
          const center = index * step - Math.PI / 2;
          const tooth = [
            point(gear.x, gear.y, innerRadius, center - step * .2),
            point(gear.x, gear.y, outerRadius, center - step * .105),
            point(gear.x, gear.y, outerRadius, center + step * .105),
            point(gear.x, gear.y, innerRadius, center + step * .2)
          ];
          ring.appendChild(svgElement("polygon", {
            class: "gear-tooth",
            points: pointsAttribute(tooth)
          }));
        }

        ring.appendChild(svgElement("circle", {
          class: "gear-outer",
          cx: gear.x,
          cy: gear.y,
          r: rootRadius - 3
        }));
        ring.appendChild(svgElement("circle", {
          class: "gear-detail",
          cx: gear.x,
          cy: gear.y,
          r: gear.radius * .78
        }));
        ring.appendChild(svgElement("circle", {
          class: "gear-inner",
          cx: gear.x,
          cy: gear.y,
          r: gear.radius * .72
        }));

        target.appendChild(ring);
      }

      function externalTangents(first, second) {
        const dx = second.x - first.x;
        const dy = second.y - first.y;
        const distance = Math.hypot(dx, dy);
        const radiusDelta = first.radius - second.radius;
        const c = radiusDelta / distance;
        const h = Math.sqrt(Math.max(0, 1 - c * c));

        return [-1, 1].map(sign => {
          const nx = (dx * c - sign * dy * h) / distance;
          const ny = (dy * c + sign * dx * h) / distance;
          return {
            first: {
              x: first.x + first.radius * nx,
              y: first.y + first.radius * ny
            },
            second: {
              x: second.x + second.radius * nx,
              y: second.y + second.radius * ny
            }
          };
        });
      }

      function drawBelt() {
        const belt = document.getElementById("belt");
        const runs = externalTangents(BIG, SMALL);

        runs.forEach((run, index) => {
          const start = index === 0 ? run.first : run.second;
          const end = index === 0 ? run.second : run.first;
          const d = `M ${start.x.toFixed(2)} ${start.y.toFixed(2)} L ${end.x.toFixed(2)} ${end.y.toFixed(2)}`;

          belt.appendChild(svgElement("path", { class: "belt-base", d }));
          belt.appendChild(svgElement("path", {
            class: "belt-motion",
            d
          }));
        });
      }

      drawBelt();
      drawGear("big-gear", BIG);
      drawGear("small-gear", SMALL);
    })();
  </script>
</body>
</html>
